<title>Sunset and sunrise, anywhere, any day</title>

<style>

    --shadow: 0 8px 24px #2a20141a; --headline: #dc2626; --accent: #ea580c;
  }
}
@media (max-width: 720px) {
  :root { --margin: 12px; --control: 44px; --bar-padding: 8px; --chart-height: 56px; --size-figure: 40px; --size-title: 17px; }
}
@media (min-width: 2560px) and (max-resolution: 1.5dppx), (min-width: 2560px) and (-webkit-max-device-pixel-ratio: 1.5) {
  :root { --ui: 1.5; }
}
* { box-sizing: border-box; }
.top-bar > *, .answer, .answer-words { min-width: 0; }

button, input { font: inherit; color: inherit; }

[hidden] { display: none !important; }

.answer-time.polar { font-size: calc(var(--size-figure) * .62); }
.answer-words { min-width: 0; font-size: var(--size-title); font-weight: 600; line-height: 1.2; }

.answer-date { color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.answer-tag:not(:empty)::before { content: '· '; color: var(--muted); }
.date-wrap { min-width: 0; }

.segmented { display: flex; background: var(--raised); border-radius: var(--radius-control); padding: 3px; height: var(--control); }

.segmented button[aria-pressed=true] { background: var(--selected-background); color: var(--selected-text); }
.segmented button:hover:not([aria-pressed=true]) { background: var(--hover); }

.control:hover { background: var(--hover); }
.control[aria-pressed=true] { background: var(--selected-background); color: var(--selected-text); }

.control.icon svg { fill: currentColor; stroke: none; width: calc(14px * var(--ui)); }
.search { position: relative; }
.search input { width: calc(260px * var(--ui)); font-weight: 400; padding-right: calc(var(--control) + 2px); }
.locate { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: calc(var(--control) - 8px); height: calc(var(--control) - 8px); border: 0; border-radius: 8px; background: transparent; color: var(--text); display: grid; place-items: center; }
.locate:hover { background: var(--hover); }
.locate svg { width: calc(16px * var(--ui)); height: calc(16px * var(--ui)); fill: currentColor; }
.search-results { position: absolute; right: 0; top: calc(var(--control) + 6px); width: calc(300px * var(--ui)); background: var(--page); border: 1px solid var(--border); border-radius: var(--radius-panel); box-shadow: var(--shadow); padding: 6px; z-index: 8; }
.search-results button { display: flex; justify-content: space-between; gap: 12px; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; text-align: left; }
.search-results button:hover, .search-results button:first-child { background: var(--hover); }

.map-area { position: relative; min-height: 0; overflow: hidden; background: var(--map-sea); }

#map-labels { cursor: grab; touch-action: none; }
.map-buttons { position: absolute; right: var(--margin); top: calc(12px * var(--ui)); display: flex; z-index: 2; background: #1b1f2ed9; border-radius: var(--radius-control); padding: 3px; box-shadow: var(--shadow); }
.map-buttons button { border: 0; height: calc(var(--control) - 6px); padding: 0 calc(14px * var(--ui)); border-radius: calc(7px * var(--ui)); background: transparent; color: #ffffff; font-weight: 600; }
.map-buttons button[aria-pressed=true] { background: #ffffff; color: #1b1f2e; }
.map-mode { left: var(--margin); right: auto; }
.map-key { width: calc(280px * var(--ui)); align-self: end; }
.map-key-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: var(--size-small); color: var(--muted); }
.map-key-caption { font-weight: 600; }
.map-key-bar { position: relative; height: calc(10px * var(--ui)); border-radius: 2px; }
.map-key-marker { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--text); border-radius: 2px; box-shadow: 0 0 0 1.5px var(--page); }
.map-key-ticks { position: relative; height: calc(18px * var(--ui)); font-size: calc(12px * var(--ui)); color: var(--muted); font-variant-numeric: tabular-nums; }
.map-key-ticks span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
.map-key-polar { display: flex; gap: 12px; font-size: calc(12px * var(--ui)); }
.map-key-polar span { display: inline-flex; align-items: center; gap: 6px; }
.map-key-polar i { width: calc(14px * var(--ui)); height: calc(10px * var(--ui)); border-radius: 2px; display: inline-block; }
.polar-night { background: var(--polar-night); } .midnight-sun { background: var(--midnight-sun); }
.attribution { position: absolute; right: 6px; bottom: 4px; z-index: 2; text-decoration: none; white-space: nowrap; font-size: calc(11px * var(--ui)); color: #ffffffa6; }
.tooltip { position: absolute; pointer-events: none; background: var(--page); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 5px 9px; font-size: var(--size-small); white-space: nowrap; z-index: 4; }
.tooltip b { font-weight: 600; }

.year-bar { border-top: 1px solid var(--border); padding: var(--bar-padding) var(--margin); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: calc(28px * var(--ui)); }
.year { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.strip-row { display: flex; align-items: center; gap: calc(10px * var(--ui)); }
.strip-row .chart-wrap { flex: 1; min-width: 0; }
.days { display: flex; gap: 2px; margin-left: calc(var(--control) + 10px * var(--ui)); overflow-x: auto; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: none; border: 0; background: transparent; color: var(--muted); font-size: var(--size-small); font-weight: 600; padding: 3px calc(9px * var(--ui)); border-radius: 999px; white-space: nowrap; }
.days button:hover { color: var(--text); }
.days button[aria-pressed=true] { background: var(--selected-background); color: var(--selected-text); }
.clocks { display: flex; align-items: center; }
.date-line { border: 0; background: transparent; padding: 0; color: var(--muted); font: inherit; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; text-align: left; }
.date-line:hover { color: var(--text); }
.date-line svg { width: calc(12px * var(--ui)); height: calc(12px * var(--ui)); fill: none; stroke: currentColor; stroke-width: 1.8; flex: none; }
.date-wrap, .share-wrap { position: relative; }
.calendar { position: absolute; left: 0; top: calc(100% + 10px); width: calc(300px * var(--ui)); background: var(--page); border: 1px solid var(--border); border-radius: var(--radius-panel); box-shadow: var(--shadow); padding: calc(12px * var(--ui)); z-index: 9; }
.calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
.calendar-head button { border: 0; background: var(--raised); border-radius: 8px; width: calc(34px * var(--ui)); height: calc(34px * var(--ui)); font-size: 18px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.calendar-grid .weekday { font-size: var(--size-small); color: var(--muted); padding: 4px 0; }
.calendar-grid button { border: 0; background: transparent; border-radius: 8px; height: calc(36px * var(--ui)); font-variant-numeric: tabular-nums; position: relative; }
.calendar-grid button:hover { background: var(--hover); }
.calendar-grid button.today { box-shadow: inset 0 0 0 1.5px var(--text); }
.calendar-grid button[aria-pressed=true] { background: var(--selected-background); color: var(--selected-text); }
.calendar-grid button.key::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.chart-wrap { position: relative; }
#year-chart { width: 100%; height: var(--chart-height); display: block; cursor: ew-resize; touch-action: none; }
.chart-tooltip { position: absolute; top: 0; transform: translate(-50%, -100%); pointer-events: none; background: var(--page); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 5px 9px; font-size: var(--size-small); white-space: nowrap; z-index: 4; }
.chart-tooltip b { font-weight: 600; }
.share-panel { position: absolute; right: 0; top: calc(var(--control) + 10px); width: calc(340px * var(--ui)); background: var(--page); border: 1px solid var(--border); border-radius: var(--radius-panel); box-shadow: var(--shadow); padding: calc(12px * var(--ui)); z-index: 9; }
.share-panel img { width: 100%; height: auto; display: block; border-radius: 8px; }
.share-button { background: var(--selected-background); color: var(--selected-text); }
.share-button:hover { background: var(--selected-background); opacity: .88; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.panel-head .close { border: 0; background: var(--raised); width: 32px; height: 32px; border-radius: 999px; font-size: 20px; line-height: 1; }
.backdrop { position: fixed; inset: 0; z-index: 8; background: transparent; }
.share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-top: calc(12px * var(--ui)); }
.share-actions .control { justify-content: center; }
.share-actions .primary { grid-column: 1 / -1; background: var(--selected-background); color: var(--selected-text); }
.share-status { margin: 8px 0 0; min-height: 1.2em; color: var(--muted); font-size: var(--size-small); }
.card-view { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 20; }
.card-view img { max-width: 100%; max-height: 100%; }

@media (max-width: 1180px) { .search input { width: calc(170px * var(--ui)); } }
@media (max-width: 720px) {
  .tools { width: 100%; }

  .days { margin-left: 0; order: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; overflow: visible; }

  .clocks .long { display: none; }
  .map-buttons button { height: 32px; padding: 0 10px; font-size: var(--size-small); }
  .calendar { position: fixed; left: 12px; right: 12px; bottom: 12px; width: auto; }

  .share-panel img { width: auto; max-width: 100%; max-height: 46dvh; margin: 0 auto; }

</head>
<body>
<header class="top-bar">
  <div class="answer" aria-live="polite">
    <span class="answer-time" id="answer-time"></span>
    <div class="answer-words">
      <div class="answer-place" id="answer-place">&nbsp;</div>
      <div class="answer-dateline">
        <div class="date-wrap">
          <button class="date-line" id="date-button" aria-label="Choose a date"><span class="answer-date" id="answer-date">&nbsp;</span><svg viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
          <div class="calendar" id="calendar" role="dialog" aria-label="Choose a date" hidden>
            <div class="calendar-head"><button id="calendar-previous" aria-label="Previous month">‹</button><span id="calendar-month"></span><button id="calendar-next" aria-label="Next month">›</button></div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </div>
        </div>
        <span class="answer-tag" id="answer-tag"></span>
      </div>
    </div>
  </div>
  <div class="tools">
    <div class="search">
      <input class="control" id="search" placeholder="Search a place" autocomplete="off" spellcheck="false" aria-label="Search a place">
      <button class="locate" id="locate" aria-label="My location" title="My location"><svg viewBox="0 0 16 16"><path d="M14 2 2 7.2l5.2 1.6L8.8 14z"/></svg></button>
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <div class="share-wrap">
        <button class="control share-button" id="share-button"><svg viewBox="0 0 16 16"><path d="M8 10V1.5M4.5 5 8 1.5 11.5 5M3 8v6.5h10V8"/></svg>Share</button>
        <div class="share-panel" id="share-panel" role="dialog" aria-label="Share" hidden>
          <div class="panel-head"><b>Share</b><button class="close" id="share-close" aria-label="Close">×</button></div>
          <img id="share-preview" alt="">
          <div class="share-actions">
            <button class="control primary" id="share-native" hidden>Share…</button>
            <button class="control" id="copy-image">Copy image</button>
            <button class="control" id="copy-link">Copy link</button>
          </div>
          <p class="share-status" id="share-status" role="status"></p>
        </div>
      </div>
  </div>
</header>

<main class="map-area" id="map-area">
  <canvas id="map-gl"></canvas>
  <canvas id="map-labels"></canvas>
  <div class="map-buttons map-mode" id="map-mode" role="group" aria-label="Show">
    <button id="show-sunset" aria-pressed="true">Sunset</button>
    <button id="show-sunrise" aria-pressed="false">Sunrise</button>
  </div>
  <div class="map-buttons" id="map-buttons">
    <button id="view-world">World</button>
    <button id="view-region">Europe</button>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <a class="attribution" id="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<footer class="year-bar">
  <div class="map-key" id="map-key">
    <div class="map-key-head"><span class="map-key-caption" id="map-key-caption">Sunset time</span><span class="map-key-polar" id="map-key-polar"><span id="key-polar-night" hidden><i class="polar-night"></i>Polar night</span><span id="key-midnight-sun" hidden><i class="midnight-sun"></i>Midnight sun</span></span></div>
    <div class="map-key-bar" id="map-key-bar"><i class="map-key-marker" id="map-key-marker" hidden></i></div>
    <div class="map-key-ticks" id="map-key-ticks"></div>

  </div>
  <div class="year">
    <div class="days" id="key-days" role="group" aria-label="Days"></div>
    <div class="strip-row">
      <button class="control icon" id="play" aria-label="Play the year"><svg viewBox="0 0 14 14" id="play-icon"><path d="M2 1l11 6-11 6z"/></svg></button>
      <div class="chart-wrap">
        <canvas id="year-chart" tabindex="0" aria-label="The year. Drag or use the arrow keys to choose a day."></canvas>
        <div class="chart-tooltip" id="chart-tooltip" hidden></div>
      </div>
    </div>
  </div>
  <div class="clocks" role="group" aria-label="Clocks">
    <div class="segmented" id="clocks">
      <button data-clocks="as-they-are" aria-pressed="true">Clocks change</button>
      <button data-clocks="winter-time" aria-pressed="false">Always winter<span class="long"> time</span></button>
      <button data-clocks="summer-time" aria-pressed="false">Always summer<span class="long"> time</span></button>
    </div>
  </div>
</footer>

<script type="module">
import * as d3 from '/vendor/npm/d3@7/+esm';
import * as topojson from '/vendor/npm/topojson-client@3/+esm';
import earcut, { deviation } from '/vendor/npm/earcut@3/+esm';

// ================================================================ The sun (NOAA / Meeus)
const DEG = Math.PI / 180, DAY_MS = 86400000;
const SIN_SUN_ON_HORIZON = Math.sin(-0.833 * DEG); // centre of the sun 0.833 degrees down: its radius plus refraction
function solarDeclinationAndEquationOfTime(utcMs) {
  const jc = (utcMs / DAY_MS + 2440587.5 - 2451545) / 36525;
  const meanLongitude = ((280.46646 + jc * (36000.76983 + jc * 0.0003032)) % 360 + 360) % 360;
  const meanAnomaly = 357.52911 + jc * (35999.05029 - 0.0001537 * jc);
  const eccentricity = 0.016708634 - jc * (0.000042037 + 0.0000001267 * jc);
  const centre = Math.sin(meanAnomaly * DEG) * (1.914602 - jc * (0.004817 + 0.000014 * jc))
    + Math.sin(2 * meanAnomaly * DEG) * (0.019993 - 0.000101 * jc) + Math.sin(3 * meanAnomaly * DEG) * 0.000289;
  const omega = 125.04 - 1934.136 * jc;
  const apparentLongitude = meanLongitude + centre - 0.00569 - 0.00478 * Math.sin(omega * DEG);
  const obliquity = 23 + (26 + (21.448 - jc * (46.815 + jc * (0.00059 - jc * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(omega * DEG);
  const declination = Math.asin(Math.sin(obliquity * DEG) * Math.sin(apparentLongitude * DEG));
  const y = Math.tan(obliquity * DEG / 2) ** 2;
  const equationOfTimeMinutes = 4 / DEG * (y * Math.sin(2 * meanLongitude * DEG) - 2 * eccentricity * Math.sin(meanAnomaly * DEG)
    + 4 * eccentricity * y * Math.sin(meanAnomaly * DEG) * Math.cos(2 * meanLongitude * DEG)
    - 0.5 * y * y * Math.sin(4 * meanLongitude * DEG) - 1.25 * eccentricity * eccentricity * Math.sin(2 * meanAnomaly * DEG));
  return { declination, equationOfTimeMinutes };
}
// Minutes after 00:00 UTC on dayUtcMs, or { polar: 'night' | 'day' } when the sun does not cross the horizon.
function sunEventUtcMinutes(dayUtcMs, latitude, longitude, event) {
  const direction = event === 'sunset' ? 1 : -1;
  let minutes = 720 - 4 * longitude + direction * 360;
  for (let pass = 0; pass < 3; pass++) {
    const { declination, equationOfTimeMinutes } = solarDeclinationAndEquationOfTime(dayUtcMs + minutes * 60000);
    const cosHourAngle = (SIN_SUN_ON_HORIZON - Math.sin(latitude * DEG) * Math.sin(declination)) / (Math.cos(latitude * DEG) * Math.cos(declination));
    if (cosHourAngle > 1) return { polar: 'night' };
    if (cosHourAngle < -1) return { polar: 'day' };
    minutes = 720 - 4 * longitude - equationOfTimeMinutes + direction * 4 * Math.acos(cosHourAngle) / DEG;
  }
  return { minutes };
}
// The shader takes the sun's position at noon UTC and its rate of change, which is exact to well under a minute.
function sunUniforms(dayUtcMs) {
  const start = solarDeclinationAndEquationOfTime(dayUtcMs), noon = solarDeclinationAndEquationOfTime(dayUtcMs + DAY_MS / 2), end = solarDeclinationAndEquationOfTime(dayUtcMs + DAY_MS);
  return [noon.declination, (end.declination - start.declination) / 1440, noon.equationOfTimeMinutes, (end.equationOfTimeMinutes - start.equationOfTimeMinutes) / 1440];
}

document.getElementById('copy-image').addEventListener('click', async () => {
  const blob = canvasBlob(sharePostCanvas);
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); shareStatus.textContent = 'Image copied. Paste it into your post.'; }
  catch {
    const url = URL.createObjectURL(await blob), link = document.createElement('a');
    link.href = url; link.download = imageName(); link.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    shareStatus.textContent = 'Image downloaded.';
  }
});
const nativeShare = document.getElementById('share-native');
nativeShare.hidden = !(navigator.canShare && matchMedia('(pointer: coarse)').matches);
nativeShare.addEventListener('click', async () => {
  const file = new File([await canvasBlob(sharePostCanvas)], imageName(), { type: 'image/png' });
  const data = { url: shareUrl(), files: [file] };
  await navigator.share(navigator.canShare(data) ? data : { url: shareUrl(), title: document.title }).catch(() => {});
});

// ================================================================ Playing the year, slowly
const DAY_STEP_MS = 220;
let playTimer = null;
function startPlaying() {
  state.playing = true;
  document.getElementById('play').setAttribute('aria-label', 'Pause');
  document.getElementById('play-icon').innerHTML = '<path d="M2 1h4v12H2zM8 1h4v12H8z"/>';
  playTimer = setInterval(() => setDay(wrapIntoYear(state.dayUtcMs + DAY_MS)), DAY_STEP_MS);
}
function stopPlaying() {
  if (!state.playing) return;
  state.playing = false; clearInterval(playTimer);
  document.getElementById('play').setAttribute('aria-label', 'Play the year');
  document.getElementById('play-icon').innerHTML = '<path d="M2 1l11 6-11 6z"/>';
  writeUrlSoon();
}
document.getElementById('play').addEventListener('click', () => { openShare(false); openCalendar(false); state.playing ? stopPlaying() : startPlaying(); });

// ================================================================ Wiring
function setDay(dayUtcMs) {
  if (yearOf(dayUtcMs) !== yearOf(state.dayUtcMs)) chartCache = null;
  state.dayUtcMs = dayUtcMs;
  writeAnswer(); drawChart();
  if (mainView) { refitColours(); render(); }
}
function selectPlace(place, moveMap) {
  state.place = place; chartCache = null;
  writeAnswer(); drawChart();
  if (moveMap) setView('region', place); else settleView();
}
function setEvent(event) {
  state.event = event;
  document.getElementById('show-sunset').setAttribute('aria-pressed', event === 'sunset');
  document.getElementById('show-sunrise').setAttribute('aria-pressed', event === 'sunrise');
  writeAnswer(); drawChart();
  if (mainView) { refitColours(true); render(); writeUrlSoon(); }
}
function setClocks(clocks) {
  state.clocks = clocks; chartCache = null;
  for (const button of document.querySelectorAll('#clocks button')) button.setAttribute('aria-pressed', button.dataset.clocks === clocks);
  writeAnswer(); drawChart();
  if (mainView) { refitColours(); render(); writeUrlSoon(); }
}
document.getElementById('show-sunset').addEventListener('click', () => setEvent('sunset'));
document.getElementById('show-sunrise').addEventListener('click', () => setEvent('sunrise'));
document.getElementById('clocks').addEventListener('click', event => { const button = event.target.closest('button'); if (button) setClocks(button.dataset.clocks); });
document.getElementById('view-world').addEventListener('click', () => setView('world'));
document.getElementById('view-region').addEventListener('click', () => setView('region'));

const searchInput = document.getElementById('search'), searchResults = document.getElementById('search-results');
let searchMatches = [];
searchInput.addEventListener('input', () => {
  const query = plainName(searchInput.value.trim());
  searchMatches = query ? searchOrder.filter(c => c.searchNames.some(name => name.startsWith(query))).slice(0, 6) : [];
  searchResults.innerHTML = searchMatches.map((c, i) => `<button data-index="${i}">${c.name}<small>${regionNames.of(c.country)}</small></button>`).join('');
  searchResults.hidden = !searchMatches.length;
});
searchResults.addEventListener('click', event => { const button = event.target.closest('button'); if (button) chooseSearch(searchMatches[button.dataset.index]); });
searchInput.addEventListener('keydown', event => { if (event.key === 'Enter' && searchMatches[0]) chooseSearch(searchMatches[0]); });
function selectNear(latitude, longitude) {
  selectPlace(nearestPlace(latitude, longitude, 30) || pointPlace(latitude, longitude), true);
}
document.getElementById('locate').addEventListener('click', () => {
  const fail = () => { searchInput.placeholder = 'Location not available'; setTimeout(() => { searchInput.placeholder = 'Search a place'; }, 3000); };
  if (!navigator.geolocation) return fail();
  navigator.geolocation.getCurrentPosition(position => selectNear(position.coords.latitude, position.coords.longitude), fail, { maximumAge: 600000, timeout: 10000 });
});
function chooseSearch(place) { searchInput.value = ''; searchResults.hidden = true; searchInput.blur(); selectPlace(place, true); }

await Promise.all(['400 11px Barlow', '600 12px Barlow', '600 46px Barlow', '800 17px "Barlow Condensed"'].map(font => document.fonts.load(font)));
let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!baseProjection) return; if (viewName === 'moved') settleView(); else setView(viewName); drawChart(); }, 60); }).observe(mapArea);
setEvent(state.event);
setClocks(state.clocks);
const linkMap = params.get('map') && params.get('map').split(',').map(Number);
if (linkMap && linkMap.length === 3 && linkMap.every(Number.isFinite)) setViewFromLink(...linkMap);
else setView(params.get('view') === 'world' ? 'world' : 'region');
// With no place in the link, start roughly where the visitor is: the site's server reads its own IP lookup (/api/home).
if (!params.get('place') && !params.get('point')) {
  fetch('/api/home').then(response => response.ok ? response.json() : null).then(home => {
    if (home && Number.isFinite(home.latitude) && Number.isFinite(home.longitude)) selectNear(home.latitude, home.longitude);
  }).catch(() => {});
}

// A link's preview picture at full size, for checking: ?card=link or ?card=post
if (params.get('card')) {
  const view = document.createElement('div'); view.className = 'card-view';
  const image = new Image(); image.src = drawShareImage(params.get('card')).toDataURL('image/png');
  view.append(image); document.body.append(view);
}
window.sunsetDesign = { colourOfDay: minutes => rampColourAt(minutes, dayDomain()), zoneAnchors: () => zoneAnchors, landDeviation: geometry.land.worstDeviation, state, placeEvent, cities: searchOrder, formatClock, render, setDay, transformTo: t => { transform = t; render(); } };
</script>
</body>
</html>
